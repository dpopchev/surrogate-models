# pyproject.toml at the COLOCATED level (rules/python.md -> Levels): python is a
# tool of a repository that is not a python project. Each module lives in the
# folder of the artifact it serves with test_<module>.py beside it; code used by
# several folders lives in shared/. uv manages the local .venv from this file;
# nothing is built.

[project]
name = "surrogate_models"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "skorch>=1.4.0",
    "threadpoolctl>=3.7.0",
    "torch>=2.14.1",
]

[tool.uv]
package = false

# This machine is CPU-only (Intel integrated graphics, no CUDA): every ML dependency is
# installed without its GPU parts. torch and torchvision resolve from the PyTorch CPU
# index (explicit: nothing else is looked up there); XGBoost is added as `xgboost-cpu`.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1",
  "pandas-stubs>=3.0.5.260914",
]

# ---------------------------------------------------------------------------
# Tools -- configured here, never in scattered rc files.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# Tests are collected from every artifact folder and shared/. The default
# prepend import mode puts each test's folder on sys.path, so a test imports
# the module beside it by name; importlib mode cannot. Basenames are therefore
# unique in the repository. The root on pythonpath makes `shared.<m>` importable.
testpaths = ["."]
pythonpath = ["."]
norecursedirs = [".*", "build", "local", "node_modules"]
addopts = "-ra --doctest-modules"
# Tool residuals live in local/; tools without a pyproject key are pointed
# there by mk/python.mk's exports.
cache_dir = "local/.pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["build", "local"]
cache-dir = "local/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
# The root execution environment resolves `shared.<m>`; a module's sibling
# import resolves from its own folder.
include = ["."]
exclude = ["**/__pycache__", ".venv", "build", "local"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
