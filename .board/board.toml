# .board/board.toml -- written by `board bind`; every key: skills/board/local.md

[views]
kanban = false            # also write KANBAN.md
csv = false               # also write board.csv

[knowledge]
budget_chars = 7500       # KNOWLEDGE.md cap; over it board check fails (V16)
entry_max_chars = 300     # one Finding, Decision or Deviation line

[landing]
mode = "ff-main"          # pr | ff-main
approver = "developer"    # developer | agent
branch_id = "local"       # local | remote
tag = "epic-close"        # epic-close | root-close | none
ci = "none"               # pipeline | none -- everything runs locally: make check before each fast-forward
# worktree (developer, 2026-10-09, revising W-058's "unset"): a long run pins this checkout on its
# branch, so work item branches are checked out under the sibling folder; make check there with
# LOCAL=../surrogate-models/local reads the inputs and may rebuild the state parquets, equal to the
# run's (W-092 Finding). Never a run target (baseline, representation, families, tuning) from a
# worktree while a batch runs here, and the board is written from this checkout only.
worktree = "../surrogate-models-wt"

[show]
detail = "brief"          # board show default: title | brief | full

# Optional: sync the local record to an external board.
# [remote]
# backend = "azure-devops"          # azure-devops | jira | github | other
# locator = "myorg/MyProject"       # org/project | Jira key | owner/repo
# area = "MyProject\\Team A"
# iteration = "MyProject\\Team A"   # Azure DevOps only
# credential = "local/azure/devops.pat"   # under local/, never its value
# token = "AB#{id}"                 # AB#{id} | {key}-{n} | #{n}

