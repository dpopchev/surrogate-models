# The neutron-star data appendix -- which NS EDA figures and tables eda_neutron_stars.py renders; the section text
# places each one beside the paragraph that cites it, and a deselected one simply drops out.
# Also available: "univariate" (every variable, equal bins), "curve_adjacency"
# (nearest-neighbour distance, own vs other curve) and "grid_fill" (rows per curve; the
# triangle already shows in mass_max).
figures = [
  "univariate_continuous",  # rho_c, M, D, D/M raw and log10, one bar per grid value
  "mass_density",           # M vs log10 rho_c per curve
  "charge_target",          # M vs log10 D and log10 D/M, by lambda and beta
  "mass_max",               # distance to each curve's M_max, M_max over the grid
]
tables = ["univariate", "charge_correlation", "split_strategies"]

# Which variant of each neutron-star data appendix figure the paper places; `make figures` draws them all
# side by side under build/sections/91_neutron_stars/figures/ to pick from (W-112).
[variants]
charge_target = "scatter"            # scatter: every row | lines: one line per curve
                                     # lambda_inset: by lambda, a beta miniature inset
mass_density = "by_lambda"           # by_lambda | by_beta: the curves coloured by it
                                     # two_panels: by lambda and by beta side by side
univariate_continuous = "histograms" # histograms: a row per variable, raw and log10
                                     # log_counts: the same, log-y row counts
                                     # transposed: raw and log10 as two rows, half the height
mass_max = "histogram_heatmap"       # histogram_heatmap: distance to M_max and the M_max grid
                                     # heatmap_contours: the grid alone, M_max contours
                                     # log_histogram: the distance alone, log-y counts
ceilings = "annotated"               # annotated: a panel per target, 4 and 5 figures lines
                                     # figures_axis: a right axis in significant figures
                                     # one_panel: both targets' p95, target by line style
