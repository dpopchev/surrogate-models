# Section 5.2 -- which family-screen figures screen_families.py writes (W-102); placed by the
# text like Section 3's, a deselected one drops out. The family table is always written.
figures = [
  "parity",                 # each unit's best per pair: predicted against true on the test curves
  "errors",                 # the same candidates' relative error per test row, median and p95
  "scaling",                # folds' figures and the final fit's seconds against the training rows
]

# Which variant of each Section 5.2 figure the paper places; `make figures` draws them from
# FAMILIES_BATCH, nothing fitted (W-113).
[variants]
parity = "parity"            # parity: predicted against true | residual: predicted minus true
errors = "scatter_profiles"  # scatter_profiles: a panel per pair and candidate, scatter and profiles
                             # profiles: the profiles alone, candidates overlaid, a panel per pair
                             # hexbin: the rows' density as hexagons, with the profiles
scaling = "figures_and_seconds"  # figures_and_seconds: per pair the folds' figures and the fit seconds
                                 # marker_size: a panel per pair, the seconds as marker size
                                 # small_multiples: a panel per family
