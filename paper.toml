# The paper's choices, read by shared/config.py (the schema: every key and its allowed values).
# Edit a choice and re-run `make compile`; PAPER__<SECTION>__<FIELD> env vars override this file.

[plot]
context = "paper"         # paper | notebook | talk
palette = "colorblind"    # colorblind | deep | muted
font_size = 11.0
usetex = true             # LaTeX text in Latin Modern, matching the article
text_width_pt = 360.0     # 11pt a4paper \textwidth
aspect = 0.62             # figure height / width

[plot.neutron_stars]      # cool colormaps: crest | mako | Blues | GnBu | PuBu
lambda_cmap = "crest"
beta_cmap = "mako"
anchor = 0                # palette index for single-color NS marks (blue)

[plot.black_holes]        # warm colormaps: flare | rocket | Oranges | YlOrRd | OrRd
beta_cmap = "flare"
anchor = 1                # palette index for single-color BH marks (orange)

[data_analysis]
charge_floor = 1e-5       # eps of the charge target log10(max(D, eps)/M)

# Section 4.1 -- which NS EDA figures and tables eda_neutron_stars.py renders; the section text
# places each one beside the paragraph that cites it, and a deselected one simply drops out.
# Also available: "univariate" (every variable, equal bins), "curve_adjacency"
# (nearest-neighbour distance, own vs other curve) and "grid_fill" (rows per curve; the
# triangle already shows in mass_max).
[data_analysis.neutron_stars]
figures = [
  "univariate_continuous",  # rho_c, M, D, D/M raw and log10, one bar per grid value
  "mass_density",           # M vs log10 rho_c per curve
  "charge_target",          # M vs log10 D and log10 D/M, by lambda and beta
  "mass_max",               # distance to each curve's M_max, M_max over the grid
]
tables = ["univariate", "charge_correlation", "split_strategies"]

# Section 4.2 -- which BH EDA figures and tables eda_black_holes.py renders; placed by the text.
[data_analysis.black_holes]
figures = [
  "univariate_continuous",  # r_h, M, D, D/M raw and log10, one bar per grid value
  "mass_radius",            # M against r_h, one line per beta
  "charge_target",          # M against log10 D and log10 D/M, by beta
  "existence_edge",         # each beta curve's r_h range, r_h,min marked
]
tables = ["univariate", "charge_correlation", "split_strategies"]
