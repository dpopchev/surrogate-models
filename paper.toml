# The paper's choices, read by shared/config.py (the schema: every key and its allowed values).
# Edit a choice and re-run `make compile`; PAPER__<SECTION>__<FIELD> env vars override this file.

[plot]
context = "paper"         # paper | notebook | talk
palette = "colorblind"    # colorblind | deep | muted
font_size = 11.0
usetex = true             # LaTeX text in Latin Modern, matching the article
text_width_pt = 360.0     # 11pt a4paper \textwidth
text_height_pt = 595.8    # 11pt a4paper \textheight (595.80026pt by \showthe\textheight, W-097)
aspect = 0.62             # figure height / width
dpi = 450                 # figures are written as PNG at this resolution
grid_values = 250         # a density histogram bins one per value up to this many distinct values
univariate_grid_values = 60  # the same for the univariate histograms (rho_c's 200 stay 40 bins)
diagnostics_dpi = 150     # the baseline's run diagnostics, for the screen
live_every = 5            # the live loss curve is redrawn every this many epochs
live_dpi = 100            # at this resolution

[plot.neutron_stars]      # cool colormaps: crest | mako | Blues | GnBu | PuBu
lambda_cmap = "crest"
beta_cmap = "mako"
anchor = 0                # palette index for single-color NS marks (blue)

[plot.black_holes]        # warm colormaps: flare | rocket | Oranges | YlOrRd | OrRd
beta_cmap = "flare"
anchor = 1                # palette index for single-color BH marks (orange)

# Section 3.1 -- which NS EDA figures and tables eda_neutron_stars.py renders; the section text
# places each one beside the paragraph that cites it, and a deselected one simply drops out.
# Also available: "univariate" (every variable, equal bins), "curve_adjacency"
# (nearest-neighbour distance, own vs other curve) and "grid_fill" (rows per curve; the
# triangle already shows in mass_max).
[data_analysis.neutron_stars]
figures = [
  "univariate_continuous",  # rho_c, M, D, D/M raw and log10, one bar per grid value
  "mass_density",           # M vs log10 rho_c per curve
  "charge_target",          # M vs log10 D and log10 D/M, by lambda and beta
  "mass_max",               # distance to each curve's M_max, M_max over the grid
]
tables = ["univariate", "charge_correlation", "split_strategies"]

# Which variant of each Section 3.1 figure the paper places; `make variants` draws them all
# side by side under build/variants/41_neutron_stars/ to pick from (W-112).
[data_analysis.neutron_stars.variants]
charge_target = "scatter"            # scatter: every row | lines: one line per curve
                                     # lambda_inset: by lambda, a beta miniature inset
mass_density = "by_lambda"           # by_lambda | by_beta: the curves coloured by it
                                     # two_panels: by lambda and by beta side by side
univariate_continuous = "histograms" # histograms: a row per variable, raw and log10
                                     # log_counts: the same, log-y row counts
                                     # transposed: raw and log10 as two rows, half the height
mass_max = "histogram_heatmap"       # histogram_heatmap: distance to M_max and the M_max grid
                                     # heatmap_contours: the grid alone, M_max contours
                                     # log_histogram: the distance alone, log-y counts
ceilings = "annotated"               # annotated: a panel per target, 4 and 5 figures lines
                                     # figures_axis: a right axis in significant figures
                                     # one_panel: both targets' p95, target by line style

# Section 3.2 -- which BH EDA figures and tables eda_black_holes.py renders; placed by the text.
[data_analysis.black_holes]
figures = [
  "univariate_continuous",  # r_h, M, D, D/M raw and log10, one bar per grid value
  "mass_radius",            # M against r_h, one line per beta
  "charge_target",          # M against log10 D and log10 D/M, by beta
  "existence_edge",         # each beta curve's r_h range, r_h,min marked
]
tables = ["univariate", "charge_correlation", "split_strategies"]

# Which variant of each Section 3.2 figure the paper places; `make variants` draws them all
# side by side under build/variants/42_black_holes/ to pick from (W-111).
[data_analysis.black_holes.variants]
mass_radius = "inset"     # inset: M against r_h, the departure from GR in an inset
                          # departure: M - r_h/2 against r_h, the GR relation as the zero line
                          # both: the two side by side
univariate_continuous = "histograms"  # histograms | log_counts | transposed, as in 3.1
charge_target = "two_panels"          # two_panels: log10 D and log10 D/M | log_d: log10 D only
existence_edge = "segments"           # segments: each curve's r_h range
                                      # edge_line: r_h,min against beta
                                      # zoomed: the segments near the edge
ceilings = "annotated"                # annotated | figures_axis | one_panel, as in 3.1

# Section 5.2 -- which family-screen figures screen_families.py writes (W-102); placed by the
# text like Section 3's, a deselected one drops out. The family table is always written.
[results.families]
figures = [
  "parity",                 # each unit's best per pair: predicted against true on the test curves
  "errors",                 # the same candidates' relative error per test row, median and p95
  "scaling",                # folds' figures and the final fit's seconds against the training rows
]

# Which variant of each Section 5.2 figure the paper places; `make variants` draws them from
# FAMILIES_BATCH, nothing fitted (W-113).
[results.families.variants]
parity = "parity"            # parity: predicted against true | residual: predicted minus true
errors = "scatter_profiles"  # scatter_profiles: a panel per pair and candidate, scatter and profiles
                             # profiles: the profiles alone, candidates overlaid, a panel per pair
                             # hexbin: the rows' density as hexagons, with the profiles

# Section 4.1 -- the baseline network fit_baseline.py trains (E-005): a plain MLP, the control
# arm of H2 (MSE, ReLU) and H3 (no skips). PAPER__METHODOLOGY__ALGORITHMS__MAX_EPOCHS=2 in the
# environment gives a quick smoke run.
[methodology.algorithms]
width = 64                # units per hidden layer
depth = 3                 # hidden layers
activation = "relu"       # relu | gelu | tanh
loss = "mse"              # mse | huber (delta 1.0 on the standardized target)
lr = 1e-3                 # AdamW learning rate at the start of the cosine schedule
max_epochs = 500          # upper bound; early stopping usually ends sooner
batch_size = 1024         # rows per optimizer step
patience = 20             # epochs without a better validation loss before stopping
valid_fraction = 0.2      # share of the training curves held out for early stopping
seed = 20261005           # torch initialization, batch order and validation curves
log_level = "INFO"        # INFO: stage and epoch lines | DEBUG: more detail
threads = 1               # torch threads per fit: 1 is fastest here (2.6 s vs 11.4 s an epoch at 7)
workers = 6               # fits at once on one-thread processes (3.2x at 6); 1 when fit seconds are reported

# Which variant of the Section 4.1 parity figure the paper places; `make variants` draws them
# from the latest baseline batch's ledger entries, nothing fitted (W-113).
[methodology.algorithms.variants]
parity = "ns_mass"        # ns_mass: the NS mass parity | residual_strip: with its residuals below
                          # all_pairs: every dataset and target, 2 x 2
