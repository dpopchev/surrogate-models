# The paper-wide choices, read by paperlib/config.py (the schema: every key and its allowed values).
# Edit a choice and re-run `make compile`; PAPER__<SECTION>__<FIELD> env vars override this file.
# Each section's own figure and table picks and variants are in the toml beside its script.

[plot]
context = "paper"         # paper | notebook | talk
palette = "colorblind"    # colorblind | deep | muted
font_size = 11.0
usetex = true             # LaTeX text in Latin Modern, matching the article
text_width_pt = 360.0     # 11pt a4paper \textwidth
text_height_pt = 595.8    # 11pt a4paper \textheight (595.80026pt by \showthe\textheight, W-097)
aspect = 0.62             # figure height / width
dpi = 450                 # figures are written as PNG at this resolution
grid_values = 250         # a density histogram bins one per value up to this many distinct values
univariate_grid_values = 60  # the same for the univariate histograms (rho_c's 200 stay 40 bins)
diagnostics_dpi = 150     # the baseline's run diagnostics, for the screen
live_every = 5            # the live loss curve is redrawn every this many epochs
live_dpi = 100            # at this resolution
preset = "paper"          # the [plot.presets.<name>] the figures are drawn under: paper | light | large

# Each preset scales every figure's font size, mark sizes, line widths and alphas (alpha capped
# at 1); paper is the figures as drawn. make variants renders three figures under each (W-115).
[plot.presets.paper]

[plot.presets.light]
mark_scale = 0.6
line_scale = 0.7
alpha_scale = 0.6

[plot.presets.large]
font_scale = 1.0909       # 12pt over the 11pt base
mark_scale = 1.5
line_scale = 1.5

[plot.neutron_stars]      # cool colormaps: crest | mako | Blues | GnBu | PuBu
lambda_cmap = "crest"
beta_cmap = "mako"
anchor = 0                # palette index for single-color NS marks (blue)

[plot.black_holes]        # warm colormaps: flare | rocket | Oranges | YlOrRd | OrRd
beta_cmap = "flare"
anchor = 1                # palette index for single-color BH marks (orange)

# The baseline network fit_baseline.py trains (E-005), read by the screens too: a plain MLP, the
# control arm of H2 (MSE, ReLU) and H3 (no skips). PAPER__NETWORK__MAX_EPOCHS=2 in the
# environment gives a quick smoke run.
[network]
width = 64                # units per hidden layer
depth = 3                 # hidden layers
activation = "relu"       # relu | gelu | tanh
loss = "mse"              # mse | huber (delta 1.0 on the standardized target)
lr = 1e-3                 # AdamW learning rate at the start of the cosine schedule
max_epochs = 500          # upper bound; early stopping usually ends sooner
batch_size = 1024         # rows per optimizer step
patience = 20             # epochs without a better validation loss before stopping
valid_fraction = 0.2      # share of the training curves held out for early stopping
seed = 20261005           # torch initialization, batch order and validation curves
log_level = "INFO"        # INFO: stage and epoch lines | DEBUG: more detail
threads = 1               # torch threads per fit: 1 is fastest here (2.6 s vs 11.4 s an epoch at 7)
workers = 6               # fits at once on one-thread processes (3.2x at 6); 1 when fit seconds are reported

# The layout of every table, and of each results table; `make variants` renders every layout
# to a page image under build/variants/tables/ to pick from (W-114).
[tables]
layout = "small"                     # small: booktabs in the small font
                                     # aligned: siunitx columns aligning the decimals
representation = "eight_columns"     # eight_columns | split: NS and BH apart | transposed
families = "subscripts"              # subscripts: rows as 10^k | rows_column: a rows column
tuning = "screen_tuned_test"         # screen_tuned_test | no_screen | delta: tuned minus screen
baseline = "one_table"               # one_table | two_tables: test and folds apart
decisions = "wide"                   # wide: three columns | narrow: the item as a row label
